<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>原文朗读 · 交互验证</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;font:16px/1.9 system-ui;color:#293b34}header{height:72px;border-bottom:1px solid #e8edea;padding:20px 36px;color:#6a7f73;font-size:13px}.bear-web-x-container{height:calc(100vh - 72px);overflow:auto}.root-block{max-width:820px;margin:0 auto;padding:30px 40px 150px}h1{font-size:30px;line-height:1.5;margin:0 0 24px}h2{font-size:22px;margin-top:34px}p{margin:20px 0}table{border-collapse:collapse;width:100%;font-size:15px}td{border:1px solid #dce6e1;padding:14px;vertical-align:top}a{color:#287257}</style>
<header>飞书原文朗读 · 交互验证页面（模拟 TTS，不发声） <button id="run-suite">运行交互检查</button><button id="run-context">运行上下文失效检查</button><output id="test-result"></output></header><main class="bear-web-x-container"><article class="root-block" data-record-id="fixture"></article></main>
<script>
window.fixtureErrors=[];
window.addEventListener('error',event=>fixtureErrors.push({message:event.message,stack:event.error?.stack,source:event.filename,line:event.lineno}));
window.addEventListener('unhandledrejection',event=>fixtureErrors.push({message:String(event.reason),stack:event.reason?.stack}));
const root=document.querySelector('.root-block');
const block=(id,text)=>`<div class="block" data-record-id="${id}"><div class="text-editor" data-zone-container="*" data-zone-id="${id}">${text}</div></div>`;
root.innerHTML='<h1>'+block('title','题库、导入、组卷与练习回流')+'</h1><p>'+block('intro','一份题怎样变成一次有效练习。先了解题源，再检查结构。最后把练习结果带回教学。')+'</p><h2>'+block('heading','拿到题后，先选对入口')+'</h2><table><tr><td>'+block('head1','材料')+'</td><td>'+block('head2','需要确认的内容')+'</td></tr><tr><td>'+block('cell1','老师自己的 Word、PDF、扫描件')+'</td><td>'+block('cell2','核对题干、选项、答案和解析。参考<a href="#">教师端文档</a>，确认导入入口。')+'</td></tr></table>'+Array.from({length:18},(_,i)=>'<p>'+block('p'+i,`第${i+1}步：确认资料来源和使用范围。知识点标签需要支持教学判断。记录结果，让练习效果有可以解释的来源。`)+'</p>').join('');
window.testBridge={messages:[],listeners:[],disconnect:[],emit(event){const msg=[...this.messages].reverse().find(x=>x.type==='speak');for(const f of this.listeners)f({type:'event',id:msg.id,event});}};
window.fixtureChrome={};fixtureChrome.runtime={id:'fixture',connect(){const port={onMessage:{addListener(f){testBridge.listeners.push(f)}},onDisconnect:{addListener(f){testBridge.disconnect.push(f)}},disconnect(){},postMessage(msg){testBridge.messages.push(msg);if(msg.type==='voices')setTimeout(()=>testBridge.listeners.forEach(f=>f({type:'voices',voices:[{voiceName:'本机中文声音 · 测试',lang:'zh-CN',remote:false,eventTypes:['start','word','end']}]})),0)}};testBridge.port=port;return port;}};
fixtureChrome.storage={local:{async get(){return{}},async set(){}}};
</script><script src="/core.js"></script><script src="/content.js"></script><script src="/ui-scenarios.js"></script><script src="/context-scenarios.js"></script><script>document.getElementById("run-suite").onclick=async()=>{const result=await runUIScenarios();document.getElementById("test-result").textContent=JSON.stringify(result);window.uiTestResult=result;};;document.getElementById("run-context").onclick=async()=>{document.getElementById("test-result").textContent=JSON.stringify(await runContextScenarios());};</script></html>
